name: build

# 本仓（forensics-code-factory；项目标识 trae_factory）的 CI 证明两件事：
#   ① 生成器还能跑（退出码 0）；
#   ② 单文件交付物与 gen/ 同源（concat 跑完不产生差异）。
# 第二条是这次公开前审发现的真问题：入库的 html 落后于 gen/，
# 浏览器里跑的一直是旧代码。有了这条检查，它不会再悄悄漂移。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 环境自述
        run: node --version

      - name: 全品牌套件再生（退出码 0 即通过）
        run: node test_gen.js all

      - name: 单品牌再生（抽一个品牌验 CLI 入口）
        run: node test_gen.js gts

      - name: 单文件交付物与 gen/ 同源（concat 后不得有差异）
        run: |
          node concat.js
          if ! git diff --quiet -- '上位机代码工厂.html'; then
            echo "::error::单文件交付物与 gen/ 不同源——请跑 node concat.js 后一并提交"
            git diff --stat -- '上位机代码工厂.html'
            exit 1
          fi
          echo "单文件与 gen/ 同源 ✓"

      - name: 产物里不得出现本机绝对路径
        run: |
          if grep -rInE '[A-Za-z]:\\' out --include='*.md' | grep -v 'REDACTED_HOST_PATH' ; then
            echo "::error::产物里出现了本机绝对路径"
            exit 1
          fi
          echo "产物绝对路径 0 处 ✓"

  # ------------------------------------------------------------------ 电子书
  # 书在 `book/` 里，只存在于书分支上（主分支不带书，理由是让代码仓保持"可跑的最小面"）。
  # 六道门禁各自独立判退出码——**不许串成一个 shell 块**：那样只有最后一条的退出码
  # 会被 step 带出来，前面几条红了也照样全绿（axiscope 卷真踩过这个坑）。
  book:
    # 书并进 main 之后，这个作业在所有分支/PR 上都跑——
    # 书与代码同仓同分支，没有「只在书分支上验」这回事了。
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # 坐标审计要 `git show 954c210:<path>`，锚点提交必须在历史里
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 环境自述
        run: python -c "import sys; print(sys.version); print('exe:', sys.executable)"

      - name: 六道书卷门禁（逐条判退出码）
        env:
          PYTHONIOENCODING: utf-8
        run: |
          failed=""
          for s in \
            book/tools/audit_coords.py \
            book/tools/check_book_structure.py \
            book/tools/verify_crops_verbatim.py \
            book/tools/verify_book_numbers.py \
            book/tools/scan_absolute_paths.py \
            book/tools/check_broken_links.py; do
            echo "--- $s"
            if ! python "$s"; then failed="$failed $s"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::书卷门禁有失败：$failed"
            exit 1
          fi
          echo "六道书卷门禁全过 ✓"

      - name: 说明（CI 上没有兄弟仓）
        run: |
          echo "CI runner 上没有 axiscope / forensics-mcopilot 这两个兄弟仓，"
          echo "所以跨仓坐标会记为 [EXTERNAL]（已登记）或「缺仓不可判定」，"
          echo "自报门禁数字会显式 SKIP —— 这些都在输出里打印，不是静默跳过。"

